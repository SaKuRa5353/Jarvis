name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -v -m "not hw"
      - name: Run lint
        run: python -m ruff check src/mathcore src/intent.py scripts/measure_stt.py scripts/measure_wakeword.py scripts/fit_thresholds.py scripts/report.py
      - name: Run type checks
        run: python -m mypy src/mathcore
