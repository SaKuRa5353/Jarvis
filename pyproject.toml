# Конфигурация линтеров. Создан в рамках задачи T10.
#
# ВАЖНО: правила ruff здесь зафиксированы явно. Без этого файла ruff включает
# режим preview (FURB, BLE, PLW, PLR, RUF059, EXE, RUF100 для всех noqa) и
# выдаёт десятки замечаний к коду, который не относится к задаче.

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "models", "data", "logs", "КОНКУРЕНТЫ", "scripts"]

[tool.ruff.lint]
# E/W — pycodestyle, F — pyflakes, I — isort, UP — pyupgrade,
# B — bugbear, SIM — simplify, RET — return
select = ["E", "F", "I", "UP", "B", "SIM", "RET"]
# E501 (длина строки) отключена: line-length контролируется форматтером,
# а в тестах длинные строки с данными читаются лучше, чем переносы.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tests/check_*.py — не pytest-тесты, а скрипты ручной проверки: они намеренно
# импортируют после sys.path.insert и печатают отчёт на верхнем уровне модуля.
"tests/check_*.py" = ["E402"]
"tests/generate_*.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
files = ["src/mathcore"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
